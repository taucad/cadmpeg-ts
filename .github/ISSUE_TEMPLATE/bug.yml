name: Bug report
description: Report reproducible incorrect behavior.
title: '[bug]: '
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 'cadmpeg-ts@x.y.z'
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: Host
      options: [Node, Chromium, Firefox, WebKit, Native Linux, Native macOS, Native Windows]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the input format and, if you can share it, the file; the code; and the observed output or error code.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
