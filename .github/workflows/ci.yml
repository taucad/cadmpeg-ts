name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'publish-main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      kind: ${{ steps.release.outputs.kind }}
      npm-publish: ${{ steps.release.outputs.npm_publish }}
      npm-tag: ${{ steps.release.outputs.npm_tag }}
      version: ${{ steps.release.outputs.version }}
      native-matrix: ${{ steps.matrix.outputs.native }}
      native-subset: ${{ steps.matrix.outputs.subset }}
      smoke-matrix: ${{ steps.matrix.outputs.smoke }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: release
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            git diff --name-only --diff-filter=ACDMRT "origin/$BASE_REF...$SOURCE_SHA" > /tmp/changed-files
          else
            git diff-tree --no-commit-id --name-only --diff-filter=ACDMRT -r HEAD > /tmp/changed-files
          fi
          node scripts/ci-release.mjs \
            --event "$EVENT_NAME" \
            --ref "$REF_NAME" \
            --sha "$SOURCE_SHA" \
            --package-version "$(node -p "require('./package.json').version")" \
            --subject "$(git log -1 --pretty=%s "$SOURCE_SHA")" \
            --changed-files-file /tmp/changed-files
      # Both matrices are data, not static matrices. A pull request builds the
      # four representative native targets (Linux x64 and arm64 glibc, Apple
      # silicon, Windows x64) and smokes only those, with the fast smoke rows;
      # main, release, and manual runs build all sixteen and add the emulated
      # and virtualized lanes that gate a release. `subset` names the built
      # triples on a pull request and is empty on a complete run, and the
      # assembly scripts validate exactly what it names. A manual run is
      # evidence only — it derives `dispatch` from any ref and never publishes —
      # so a pull request can prove every target and lane on its own branch
      # before merge.
      - id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          KIND: ${{ steps.release.outputs.kind }}
          NPM_PUBLISH: ${{ steps.release.outputs.npm_publish }}
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { readNapiTargets } from './scripts/lib/napi-targets.mjs';

          const kind = process.env.KIND;
          const event = process.env.EVENT_NAME;
          const complete = kind === 'main' || kind === 'release' || event === 'workflow_dispatch';
          // Publication freezes and verifies every target or nothing.
          if (process.env.NPM_PUBLISH === 'true' && !complete) {
            throw new Error(`a publishing ${kind} run must build every native target`);
          }

          const builds = [
            { target: 'aarch64-apple-darwin', os: 'macos-latest', representative: true },
            { target: 'x86_64-apple-darwin', os: 'macos-latest' },
            { target: 'x86_64-pc-windows-msvc', os: 'windows-2022', representative: true },
            { target: 'aarch64-pc-windows-msvc', os: 'windows-2022' },
            { target: 'i686-pc-windows-msvc', os: 'windows-2022' },
            { target: 'x86_64-unknown-linux-gnu', os: 'ubuntu-24.04', cross: '--use-napi-cross', representative: true },
            { target: 'aarch64-unknown-linux-gnu', os: 'ubuntu-24.04', cross: '--use-napi-cross', representative: true },
            { target: 'armv7-unknown-linux-gnueabihf', os: 'ubuntu-24.04', cross: '--use-napi-cross' },
            { target: 'powerpc64le-unknown-linux-gnu', os: 'ubuntu-24.04', cross: '--use-napi-cross' },
            { target: 's390x-unknown-linux-gnu', os: 'ubuntu-24.04', cross: '--use-napi-cross' },
            { target: 'x86_64-unknown-linux-musl', os: 'ubuntu-24.04', cross: '-x' },
            { target: 'aarch64-unknown-linux-musl', os: 'ubuntu-24.04', cross: '-x' },
            { target: 'armv7-unknown-linux-musleabihf', os: 'ubuntu-24.04', cross: '-x' },
            { target: 'aarch64-linux-android', os: 'ubuntu-24.04' },
            { target: 'armv7-linux-androideabi', os: 'ubuntu-24.04' },
            { target: 'x86_64-unknown-freebsd', os: 'ubuntu-24.04' },
          ];
          const { packages } = readNapiTargets('package.json');
          const configured = packages.map(({ triple }) => triple).sort().join();
          if (builds.map(({ target }) => target).sort().join() !== configured) {
            throw new Error('the native build rows must equal package.json napi.targets');
          }
          const native = builds
            .filter((row) => complete || row.representative)
            .map((row) => ({ ...row, profile: complete ? 'release' : 'pull-request' }));
          const built = new Set(
            packages.filter(({ triple }) => native.some((row) => row.target === triple)).map(({ suffix }) => suffix),
          );

          // Official Node tarballs: the node images publish no ppc64le or s390x
          // tag on the current line, so those lanes install Node into Ubuntu.
          // Node 26 links `libatomic` on both, which `ubuntu:24.04` lacks.
          const ubuntu = (version, arch) =>
            `apt-get update && apt-get install -y --no-install-recommends ca-certificates curl libatomic1 xz-utils && curl -fsSL https://nodejs.org/dist/v${version}/node-v${version}-linux-${arch}.tar.xz | tar -xJ -C /usr/local --strip-components=1`;
          const none = 'true';
          const rows = [
            { suffix: 'darwin-arm64', lane: '22.13.0', os: 'macos-latest', recipe: 'host', timeout: 30 },
            { suffix: 'darwin-arm64', lane: '26', os: 'macos-latest', recipe: 'host', timeout: 30 },
            { suffix: 'win32-x64-msvc', lane: '22.13.0', os: 'windows-2022', recipe: 'host', timeout: 30 },
            { suffix: 'win32-x64-msvc', lane: '26', os: 'windows-2022', recipe: 'host', timeout: 30 },
            { suffix: 'win32-ia32-msvc', lane: '22.13.0', os: 'windows-2022', recipe: 'host', arch: 'x86', timeout: 30 },
            { suffix: 'win32-arm64-msvc', lane: '22.13.0', os: 'windows-11-arm', recipe: 'host', timeout: 30 },
            { suffix: 'win32-arm64-msvc', lane: '26', os: 'windows-11-arm', recipe: 'host', timeout: 30 },
            { suffix: 'linux-x64-gnu', lane: '22.13.0', os: 'ubuntu-24.04', recipe: 'host', timeout: 30 },
            { suffix: 'linux-x64-gnu', lane: '26', os: 'ubuntu-24.04', recipe: 'host', timeout: 30 },
            { suffix: 'linux-arm64-gnu', lane: '22.13.0', os: 'ubuntu-24.04-arm', recipe: 'host', timeout: 30 },
            { suffix: 'linux-arm64-gnu', lane: '26', os: 'ubuntu-24.04-arm', recipe: 'host', timeout: 30 },
            { suffix: 'linux-x64-musl', lane: '22.13.0', os: 'ubuntu-24.04', recipe: 'container', platform: 'linux/amd64', image: 'node:22.13.0-alpine', setup: none, timeout: 30 },
            { suffix: 'linux-x64-musl', lane: '26', os: 'ubuntu-24.04', recipe: 'container', platform: 'linux/amd64', image: 'node:26-alpine', setup: none, timeout: 30 },
            { suffix: 'linux-arm64-musl', lane: '22.13.0', os: 'ubuntu-24.04-arm', recipe: 'container', platform: 'linux/arm64', image: 'node:22.13.0-alpine', setup: none, timeout: 30 },
            { suffix: 'linux-arm64-musl', lane: '26', os: 'ubuntu-24.04-arm', recipe: 'container', platform: 'linux/arm64', image: 'node:26-alpine', setup: none, timeout: 30 },
            { suffix: 'darwin-x64', lane: '22.13.0', os: 'macos-15-intel', recipe: 'host', slow: true, timeout: 30 },
            { suffix: 'darwin-x64', lane: '26', os: 'macos-15-intel', recipe: 'host', slow: true, timeout: 30 },
            { suffix: 'linux-arm-gnueabihf', lane: '22.13.0', os: 'ubuntu-24.04', recipe: 'container', qemu: true, platform: 'linux/arm/v7', image: 'node:22.13.0-bookworm-slim', setup: none, slow: true, timeout: 60 },
            { suffix: 'linux-arm-musleabihf', lane: '22.13.0', os: 'ubuntu-24.04', recipe: 'container', qemu: true, platform: 'linux/arm/v7', image: 'node:22.13.0-alpine', setup: none, slow: true, timeout: 60 },
            { suffix: 'linux-ppc64-gnu', lane: '22.13.0', os: 'ubuntu-24.04', recipe: 'container', qemu: true, platform: 'linux/ppc64le', image: 'ubuntu:24.04', setup: ubuntu('22.13.0', 'ppc64le'), slow: true, timeout: 60 },
            { suffix: 'linux-ppc64-gnu', lane: '26', os: 'ubuntu-24.04', recipe: 'container', qemu: true, platform: 'linux/ppc64le', image: 'ubuntu:24.04', setup: ubuntu('26.7.0', 'ppc64le'), slow: true, timeout: 60 },
            { suffix: 'linux-s390x-gnu', lane: '22.13.0', os: 'ubuntu-24.04', recipe: 'container', qemu: true, platform: 'linux/s390x', image: 'ubuntu:24.04', setup: ubuntu('22.13.0', 's390x'), slow: true, timeout: 60 },
            { suffix: 'linux-s390x-gnu', lane: '26', os: 'ubuntu-24.04', recipe: 'container', qemu: true, platform: 'linux/s390x', image: 'ubuntu:24.04', setup: ubuntu('26.7.0', 's390x'), slow: true, timeout: 60 },
            { suffix: 'freebsd-x64', lane: '22', os: 'ubuntu-24.04', recipe: 'freebsd', slow: true, timeout: 60 },
          ];
          const smoke = rows.filter((row) => (complete || !row.slow) && built.has(row.suffix));
          console.log(`native=${JSON.stringify(native)}`);
          console.log(`subset=${complete ? '' : native.map(({ target }) => target).join(',')}`);
          console.log(`smoke=${JSON.stringify(smoke)}`);
          NODE

  quality:
    needs: preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: '26'
      - name: Require every patch to apply to the pinned upstream tag
        run: pnpm run patches:check
      - run: pnpm nx run cadmpeg-ts:quality
      - run: >-
          node --test
          tests/ci-release.test.mjs
          tests/release-attestations.test.mjs
          tests/workflow-policy.test.mjs
          tests/test-package.test.mjs
          tests/inspect-native.test.mjs
          tests/check-prepared-release.test.mjs
          tests/napi-targets.test.mjs
          tests/pack-test-tarballs.test.mjs
          tests/verify-preview-install.test.mjs
          tests/registry-wait.test.mjs
      - name: Require a Version Plan for release-affecting changes
        if: needs.preflight.outputs.kind != 'release-pull-request' && needs.preflight.outputs.kind != 'release'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            pnpm nx release plan:check --base="origin/$BASE_REF" --head=HEAD
          elif [[ "$EVENT_NAME" == push ]]; then
            if [[ "$BEFORE_SHA" == 0000000000000000000000000000000000000000 ]]; then
              echo "::error::Cannot validate Version Plans without a previous push SHA"
              exit 1
            fi
            git merge-base --is-ancestor "$BEFORE_SHA" HEAD || {
              echo "::error::Cannot validate Version Plans across a force-push"
              exit 1
            }
            pnpm nx release plan:check --base="$BEFORE_SHA" --head=HEAD
          else
            pnpm nx release plan:check --base=HEAD~1 --head=HEAD
          fi

  docs-prose:
    needs: preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: '26'
      - run: pnpm nx run cadmpeg-ts:docs-prose

  node:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13.0', '26']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
      - run: pnpm nx run cadmpeg-ts:test
      - run: pnpm nx run cadmpeg-ts:typecheck

  rust:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      # A hosted Linux runner has less memory than rustc needs to compile
      # several of cadmpeg's largest codec crates at once with one codegen
      # unit each; without swap the runner is killed mid-build.
      - name: Add swap for the codec crates
        if: runner.os == 'Linux'
        run: |
          sudo swapoff -a
          sudo fallocate -l 12G /swapfile-ci
          sudo chmod 600 /swapfile-ci
          sudo mkswap /swapfile-ci
          sudo swapon /swapfile-ci
          free -h
      - uses: ./.github/actions/setup
        with:
          node-version: '26'
      - run: node scripts/apply-patches.mjs
      - name: Clippy
        run: cargo clippy --locked --manifest-path rust/Cargo.toml --workspace --all-targets -- -D warnings
      - name: Clippy on the WebAssembly target, one module's features at a time
        run: |
          for features in step sldprt,step catia,step fcstd,step; do
            cargo clippy --locked --manifest-path rust/Cargo.toml -p cadmpeg-wasm \
              --target wasm32-unknown-unknown --features "$features" -- -D warnings
          done
      - name: Binding tests over the upstream corpus
        run: pnpm run test:rust

  build:
    name: build (${{ matrix.target }})
    needs: preflight
    timeout-minutes: 150
    strategy:
      fail-fast: false
      # preflight emits the rows: the four representative targets on a pull
      # request, all sixteen of package.json napi.targets otherwise.
      matrix:
        include: ${{ fromJSON(needs.preflight.outputs.native-matrix) }}
    runs-on: ${{ matrix.os }}
    env:
      # The NAPI-RS template's floor; rustc raises arm64 macOS to its own 11.0.
      MACOSX_DEPLOYMENT_TARGET: '10.13'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      # A hosted Linux runner has less memory than rustc needs to compile
      # several of cadmpeg's largest codec crates at once with one codegen
      # unit each; without swap the runner is killed mid-build.
      - name: Add swap for the codec crates
        if: runner.os == 'Linux'
        run: |
          sudo swapoff -a
          sudo fallocate -l 12G /swapfile-ci
          sudo chmod 600 /swapfile-ci
          sudo mkswap /swapfile-ci
          sudo swapon /swapfile-ci
          free -h
      - uses: ./.github/actions/setup
        if: matrix.target != 'x86_64-unknown-freebsd'
        with:
          node-version: '26'
      - name: Add the Rust target
        if: matrix.target != 'x86_64-unknown-freebsd'
        run: rustup target add ${{ matrix.target }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        if: matrix.cross == '-x'
        with:
          version: 0.15.2
      - uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3 # v2
        if: matrix.cross == '-x'
        with:
          tool: cargo-zigbuild
      # The macOS runners have 7 GB. With fat LTO the addon's final link
      # optimizes every codec as one module and swaps past the job limit;
      # thin LTO keeps cross-crate inlining at a fraction of the memory.
      - name: Fit the addon build in the macOS runner's memory
        if: runner.os == 'macOS'
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          echo 'CARGO_BUILD_JOBS=2' >> "$GITHUB_ENV"
          if [[ "$PROFILE" == release ]]; then
            echo 'CARGO_PROFILE_RELEASE_LTO=thin' >> "$GITHUB_ENV"
          fi
      - name: Relax link-time optimization for the i686 MSVC link
        if: matrix.profile == 'release' && matrix.target == 'i686-pc-windows-msvc'
        shell: bash
        run: |
          {
            echo 'CARGO_PROFILE_RELEASE_LTO=false'
            echo 'CARGO_PROFILE_RELEASE_CODEGEN_UNITS=32'
          } >> "$GITHUB_ENV"
      # A pull request proves the addon builds, loads, and converts on its
      # representative targets; it ships nothing. Dropping link-time
      # optimization and splitting codegen trades runtime speed it never
      # measures for build time. Main, release, and manual runs keep the
      # published profile, with the macOS and i686 relaxations above.
      - name: Trade link-time optimization for build time on a pull request
        if: matrix.profile == 'pull-request'
        shell: bash
        run: |
          {
            echo 'CARGO_PROFILE_RELEASE_LTO=false'
            echo 'CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16'
          } >> "$GITHUB_ENV"
      # sccache keeps compiled crates in the GitHub Actions cache, keyed by
      # their inputs. rust-cache restores registry dependencies only and
      # rebuilds every path crate, which is every upstream/cadmpeg codec;
      # sccache caches those too. The FreeBSD guest compiles on its own.
      # The server's idle timer counts only new requests, not compiles in
      # flight: with the default 600 s it exits ten minutes into the f3d codec
      # or the final crate, the clients compile those again locally, and a
      # macOS release row runs past its limit. A timeout of 0 keeps the server
      # up for the whole job.
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        if: matrix.target != 'x86_64-unknown-freebsd'
        with:
          version: v0.19.0
      - name: Route rustc through sccache
        if: matrix.target != 'x86_64-unknown-freebsd'
        shell: bash
        run: |
          {
            echo 'RUSTC_WRAPPER=sccache'
            echo 'SCCACHE_GHA_ENABLED=true'
            echo 'SCCACHE_IDLE_TIMEOUT=0'
          } >> "$GITHUB_ENV"
      # On the host for every row: the FreeBSD VM has no git, and it receives
      # the already-patched tree when it syncs the workspace.
      - name: Apply the upstream patch queue
        run: node scripts/apply-patches.mjs
      - name: Build the addon
        if: matrix.target != 'x86_64-unknown-freebsd'
        shell: bash
        run: |
          pnpm exec napi build --platform --release --esm --js index.js --dts index.d.ts \
            --output-dir src/native --manifest-path rust/binding-napi/Cargo.toml \
            --target ${{ matrix.target }} ${{ matrix.cross }} -- --locked
      - uses: cross-platform-actions/action@e0b9770014ba65d5e0815f15b74031c3a635f641 # v1.6.0
        if: matrix.target == 'x86_64-unknown-freebsd'
        with:
          operating_system: freebsd
          version: '15.0'
          memory: 16G
          cpu_count: 4
          shell: bash
      - name: Build the addon inside the FreeBSD virtual machine
        if: matrix.target == 'x86_64-unknown-freebsd'
        shell: cpa.sh {0} --sync-files runner-to-vm
        run: |
          set -euo pipefail
          # The FreeBSD package repository targets the newest minor of a major
          # release line, so a 15.0 guest must accept the recorded version skew.
          export IGNORE_OSVERSION=yes
          export RUSTUP_IO_THREADS=1
          # A single codec crate at one codegen unit peaks above 8 GB in rustc,
          # so the guest builds one crate at a time. Its disk has no room for
          # swap; the host's swap backs the guest's memory instead.
          export CARGO_BUILD_JOBS=1
          # The addon's fat-LTO link over every codec still exceeds the guest
          # intermittently; thin LTO keeps cross-crate inlining at a fraction
          # of the memory. Only this row relaxes it.
          export CARGO_PROFILE_RELEASE_LTO=thin
          sudo -E pkg install --yes node22 npm-node22 curl
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain none
          . "$HOME/.cargo/env"
          sudo npm install --global pnpm@11.7.0
          # The virtual machine only runs the NAPI-RS build, and Playwright's
          # install script has no FreeBSD download.
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec napi build --platform --release --esm --js index.js --dts index.d.ts \
            --output-dir src/native --manifest-path rust/binding-napi/Cargo.toml \
            --target x86_64-unknown-freebsd -- --locked
      - name: Collect the FreeBSD addon
        if: matrix.target == 'x86_64-unknown-freebsd'
        shell: cpa.sh {0} --sync-files vm-to-runner
        run: rm -rf node_modules rust/target
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bindings-${{ matrix.target }}
          path: src/native/cadmpeg-ts.*.node
          if-no-files-found: error
          retention-days: 1
      # The generated loader is the same on every row; one row ships it.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        with:
          name: napi-loader
          path: |
            src/native/index.js
            src/native/index.d.ts
          if-no-files-found: error
          retention-days: 1

  build-wasm:
    name: build-wasm (${{ matrix.module }})
    needs: preflight
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # One module per native format, each with the STEP codec (charter D11).
        # src/formats.ts owns the table; tests/workflow-policy.test.mjs holds
        # this list equal to it.
        module: [step, iges, sat, fcstd, f3d, inventor, sldprt, catia, creo, nx, rhino, pvz, usd]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      # A hosted Linux runner has less memory than rustc needs to compile
      # several of cadmpeg's largest codec crates at once with one codegen
      # unit each; without swap the runner is killed mid-build.
      - name: Add swap for the codec crates
        if: runner.os == 'Linux'
        run: |
          sudo swapoff -a
          sudo fallocate -l 12G /swapfile-ci
          sudo chmod 600 /swapfile-ci
          sudo mkswap /swapfile-ci
          sudo swapon /swapfile-ci
          free -h
      - uses: ./.github/actions/setup
        with:
          node-version: '26'
      - run: rustup target add wasm32-unknown-unknown
      # The same compilation cache the native rows use; see the build job.
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.19.0
      - name: Route rustc through sccache
        run: |
          {
            echo 'RUSTC_WRAPPER=sccache'
            echo 'SCCACHE_GHA_ENABLED=true'
            echo 'SCCACHE_IDLE_TIMEOUT=0'
          } >> "$GITHUB_ENV"
      - run: pnpm run build:wasm -- --modules ${{ matrix.module }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wasm-${{ matrix.module }}
          path: |
            src/wasm/${{ matrix.module }}.js
            src/wasm/${{ matrix.module }}_bg.wasm
          if-no-files-found: error
          retention-days: 1

  assemble:
    needs: [preflight, quality, node, rust, build, build-wasm]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # Empty on a complete run. On a pull request it names the built triples,
      # and every step below assembles and validates exactly those.
      NATIVE_SUBSET: ${{ needs.preflight.outputs.native-subset }}
    outputs:
      archive: ${{ steps.freeze.outputs.archive }}
      sha256: ${{ steps.freeze.outputs.sha256 }}
      version: ${{ steps.freeze.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: '26'
      - uses: ./.github/actions/download-verified-artifact
        with:
          pattern: bindings-*
          path: artifacts
          merge-multiple: true
      - uses: ./.github/actions/download-verified-artifact
        with:
          pattern: wasm-*
          path: src/wasm
          merge-multiple: true
      - uses: ./.github/actions/download-verified-artifact
        with:
          name: napi-loader
          path: src/native
          expect: index.js
      - name: Assemble the package from the built modules
        run: |
          printf '{"type":"module"}\n' > src/wasm/package.json
          pnpm exec tsdown
          node scripts/copy-assets.mjs
      - name: Assert the shipped entry graphs
        env:
          CADMPEG_TS_REQUIRE_DIST: '1'
        run: pnpm exec vitest run tests/import-graph.test.mjs
      # Every `pnpm run` must precede `napi pre-publish`: it rewrites the source
      # manifest's optionalDependencies, after which pnpm's pre-run dependency
      # check refuses the now-stale lockfile. From there on only `node` runs.
      - run: pnpm run pkgcheck
      - run: pnpm run check:size
      - name: Record the per-module conversion speed
        run: node scripts/check-wasm-speed.mjs
      # A NAPI-RS config that names only the built subset scopes the generated
      # directories, the collected addons, and the reconciled optional
      # dependencies to it; package.json still configures all sixteen.
      - name: Scope the platform packages to the built subset
        if: env.NATIVE_SUBSET != ''
        run: |
          node -e 'console.log(JSON.stringify({ targets: process.env.NATIVE_SUBSET.split(",") }))' \
            > "$RUNNER_TEMP/napi-subset.json"
          echo "NAPI_CONFIG=$RUNNER_TEMP/napi-subset.json" >> "$GITHUB_ENV"
      - name: Generate the platform directories
        run: pnpm exec napi create-npm-dirs --npm-dir npm ${NAPI_CONFIG:+--config-path "$NAPI_CONFIG"}
      - name: Collect the native addons
        run: pnpm exec napi artifacts --output-dir artifacts --npm-dir npm ${NAPI_CONFIG:+--config-path "$NAPI_CONFIG"}
      - name: Copy the physical license into every platform package
        run: |
          for directory in npm/*/; do
            cp license "$directory"
          done
      - name: Inspect every native binary
        env:
          # The Darwin build rows pin the same target; the inspector raises its
          # expected x64 floor to it (arm64 is floored at 11.0 by the toolchain).
          MACOSX_DEPLOYMENT_TARGET: '10.13'
        run: node scripts/inspect-native.mjs ${NATIVE_SUBSET:+--targets "$NATIVE_SUBSET"}
      - name: Reconcile the platform manifests without publishing
        run: >-
          pnpm exec napi pre-publish --skip-optional-publish -t npm --no-gh-release
          ${NAPI_CONFIG:+--config-path "$NAPI_CONFIG"}
      - name: Assert the prepared release is complete
        run: node scripts/check-prepared-release.mjs ${NATIVE_SUBSET:+--targets "$NATIVE_SUBSET"}
      - name: Pack the frozen test tarballs
        run: node scripts/pack-test-tarballs.mjs --out tarballs ${NATIVE_SUBSET:+--targets "$NATIVE_SUBSET"}
      - run: node scripts/validate-pack.mjs
      - id: freeze
        name: Freeze the prepared release tree
        run: |
          version="$(node -p "require('./package.json').version")"
          rm -rf prepared
          mkdir -p prepared/scripts
          node <<'NODE'
          const { cpSync, existsSync } = require('node:fs');
          const entries = [...require('./package.json').files, 'package.json', 'npm', 'test-tarballs.json'];
          for (const entry of entries) {
            if (!existsSync(entry)) throw new Error(`prepared release is missing ${entry}`);
            cpSync(entry, `prepared/${entry}`, { recursive: true });
          }
          NODE
          cp scripts/validate-pack.mjs scripts/package-files.mjs prepared/scripts/
          archive="prepared-release-$version.tgz"
          tar -czf "$archive" -C prepared .
          sha256sum "$archive" > "$archive.sha256"
          size="$(wc -c < "$archive")"
          # 16 addons of about 50 MB gzipped each (every codec in one
          # library) plus the WebAssembly modules measured 861 MB at 1c3798c.
          if [[ "$size" -gt 1073741824 ]]; then
            echo "::error::prepared release archive is $size bytes, above the 1 GiB ceiling"
            exit 1
          fi
          {
            echo "archive=$archive"
            echo "sha256=$(cut -d' ' -f1 < "$archive.sha256")"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prepared-release
          path: |
            prepared-release-*.tgz
            prepared-release-*.tgz.sha256
          if-no-files-found: error
          retention-days: ${{ needs.preflight.outputs.kind == 'release' && 30 || 1 }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-tarballs
          path: tarballs/
          if-no-files-found: error
          retention-days: 1

  smoke:
    name: smoke (${{ matrix.suffix }}, ${{ matrix.lane }})
    needs: [preflight, assemble]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.preflight.outputs.smoke-matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    env:
      # The frozen tarballs hold exactly the assembled targets; empty means all.
      CADMPEG_TS_NATIVE_TARGETS: ${{ needs.preflight.outputs.native-subset }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/download-verified-artifact
        with:
          name: test-tarballs
          path: tarballs
          expect: test-tarballs.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: matrix.recipe == 'host'
        with:
          node-version: ${{ matrix.lane }}
          architecture: ${{ matrix.arch }}
      - name: Convert from the frozen tarballs
        if: matrix.recipe == 'host'
        env:
          CADMPEG_TS_NATIVE_SUFFIX: ${{ matrix.suffix }}
          CADMPEG_TS_TARBALL_DIR: tarballs
        run: node scripts/test-package.mjs
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: matrix.qemu
      - name: Convert from the frozen tarballs in a container
        if: matrix.recipe == 'container'
        env:
          IMAGE: ${{ matrix.image }}
          PLATFORM: ${{ matrix.platform }}
          SETUP: ${{ matrix.setup }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          docker run --rm --platform "$PLATFORM" \
            --volume "$PWD:/cadmpeg-ts" --workdir /cadmpeg-ts \
            --env CADMPEG_TS_TARBALL_DIR=tarballs \
            --env CADMPEG_TS_NATIVE_SUFFIX="$SUFFIX" \
            --env CADMPEG_TS_NATIVE_TARGETS \
            "$IMAGE" sh -c "$SETUP && node scripts/test-package.mjs"
      - uses: cross-platform-actions/action@e0b9770014ba65d5e0815f15b74031c3a635f641 # v1.6.0
        if: matrix.recipe == 'freebsd'
        with:
          operating_system: freebsd
          version: '15.0'
          memory: 8G
          cpu_count: 3
          shell: bash
      - name: Convert from the frozen tarballs inside the FreeBSD virtual machine
        if: matrix.recipe == 'freebsd'
        shell: cpa.sh {0} --sync-files runner-to-vm
        run: |
          set -euo pipefail
          export IGNORE_OSVERSION=yes
          sudo -E pkg install --yes node22 npm-node22
          export CADMPEG_TS_NATIVE_SUFFIX=freebsd-x64
          export CADMPEG_TS_TARBALL_DIR=tarballs
          node scripts/test-package.mjs

  browser:
    name: browser (${{ matrix.browser }})
    needs: assemble
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            os: ubuntu-24.04
          - browser: firefox
            os: macos-15
          - browser: webkit
            os: macos-26
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: '26'
      - uses: ./.github/actions/download-verified-artifact
        with:
          name: test-tarballs
          path: tarballs
          expect: test-tarballs.json
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: Extract the frozen root tarball
        run: |
          mkdir -p tarballs/extracted
          tar -xzf "tarballs/$(node -p "require('./tarballs/test-tarballs.json').packages['cadmpeg-ts'].filename")" \
            -C tarballs/extracted
      - name: Convert through the frozen modules in Vitest browser mode
        run: pnpm exec vitest run --config vitest.browser.config.ts
        env:
          BROWSER: ${{ matrix.browser }}
          CADMPEG_TS_ROOT_PACKAGE: tarballs/extracted/package

  security:
    needs: preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: ./.github/actions/setup
        with:
          node-version: '26'
      - run: node scripts/apply-patches.mjs
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: rust/Cargo.toml
          rust-version: 1.97.0
      - run: pnpm audit --audit-level high

  # Report-only: pkg.pr.new refuses unwhitelisted multipart uploads (413), and
  # every addon is ~50 MB. ci-gate does not require the preview jobs; consumers
  # install the npm beta instead.
  preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [preflight, assemble, smoke, browser, security]
    continue-on-error: true
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.publish.outputs.sha }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: '26'
      - uses: ./.github/actions/download-verified-artifact
        with:
          name: test-tarballs
          path: tarballs
          expect: test-tarballs.json
      - name: Expand the tested packages for preview version rewriting
        run: node scripts/pack-test-tarballs.mjs --extract-from tarballs --out preview-packages
      - id: publish
        name: Publish the preview package graph
        run: >-
          pnpm exec pkg-pr-new publish
          --previewVersion
          --comment=update
          --commentWithSha
          --json preview.json
          --no-template
          './preview-packages/*'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pkg-pr-new-preview
          path: preview.json
          if-no-files-found: error

  preview-consumer:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [assemble, preview]
    continue-on-error: true
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: '26'
      - uses: ./.github/actions/download-verified-artifact
        with:
          name: test-tarballs
          path: tarballs
          expect: test-tarballs.json
      - uses: ./.github/actions/download-verified-artifact
        with:
          name: pkg-pr-new-preview
          path: preview
          expect: preview.json
      - run: node scripts/pack-test-tarballs.mjs --extract-from tarballs --out preview-packages
      - run: >-
          node scripts/verify-preview-install.mjs
          --from preview-packages
          --metadata preview/preview.json
          --sha '${{ needs.preview.outputs.sha }}'

  publish:
    if: needs.preflight.outputs.npm-publish == 'true'
    needs: [preflight, assemble, docs-prose, smoke, browser, security]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      NPM_CONFIG_PROVENANCE: 'true'
      # A prerelease publishes under its preid (`beta`), never `latest`; npm
      # and `napi pre-publish` both read the dist-tag from this variable.
      NPM_CONFIG_TAG: ${{ needs.preflight.outputs.npm-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: '26'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          registry-url: https://registry.npmjs.org
      - uses: ./.github/actions/download-verified-artifact
        with:
          name: prepared-release
          path: prepared-release
          expect: ${{ needs.assemble.outputs.archive }} ${{ needs.assemble.outputs.archive }}.sha256
      - name: Extract the frozen release tree
        env:
          ARCHIVE: ${{ needs.assemble.outputs.archive }}
        run: |
          cd prepared-release
          sha256sum --check "$ARCHIVE.sha256"
          cd ..
          mkdir -p release
          tar -xzf "prepared-release/$ARCHIVE" -C release
      - name: Validate the frozen release tree
        working-directory: release
        run: node scripts/validate-pack.mjs
      # Publication is every configured target or nothing: whatever matrix the
      # run built, the frozen tree must hold all sixteen platform packages.
      - name: Require every configured target in the frozen release tree
        run: node scripts/check-prepared-release.mjs --root release
      - name: Publish the sixteen platform packages
        run: pnpm exec napi pre-publish --cwd release -t npm --no-gh-release
      - name: Publish the root package
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          if [[ "$(npm view "cadmpeg-ts@$VERSION" version 2>/dev/null || true)" == "$VERSION" ]]; then
            echo "cadmpeg-ts@$VERSION is already published"
            exit 0
          fi
          if ! output="$(npm publish ./release 2>&1)"; then
            echo "$output"
            grep --quiet 'cannot publish over the previously published versions' <<<"$output" || exit 1
            echo "cadmpeg-ts@$VERSION was already published"
            exit 0
          fi
          echo "$output"

  registry-verify:
    if: always() && needs.preflight.outputs.npm-publish == 'true' && needs.publish.result == 'success'
    needs: [preflight, assemble, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/download-verified-artifact
        with:
          name: test-tarballs
          path: tarballs
          expect: test-tarballs.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          registry-url: https://registry.npmjs.org
      - name: Wait for the registry to serve every published package
        run: node scripts/registry-wait.mjs --tarballs tarballs/test-tarballs.json --interval-seconds 30 --timeout-minutes 30
      - name: Install every package and verify its attestation
        run: |
          workspace="$PWD"
          node <<'NODE' > /tmp/specifiers
          const { packages, version } = require('./tarballs/test-tarballs.json');
          console.log(Object.keys(packages).sort().map((name) => `${name}@${version}`).join(' '));
          NODE
          directory="$(mktemp -d)"
          cd "$directory"
          npm init --yes >/dev/null
          xargs npm install --force --ignore-scripts < /tmp/specifiers
          npm audit signatures --json --include-attestations > /tmp/npm-audit-signatures.json
          cd "$workspace"
          node scripts/verify-release-attestations.mjs \
            /tmp/npm-audit-signatures.json \
            tarballs/test-tarballs.json \
            '${{ github.sha }}' \
            '${{ github.run_id }}'

  registry-smoke:
    name: registry-smoke (${{ matrix.label }})
    needs: [preflight, registry-verify]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64-gnu
            os: ubuntu-24.04
            recipe: host
            suffix: linux-x64-gnu
          - label: darwin-arm64
            os: macos-latest
            recipe: host
            suffix: darwin-arm64
          - label: win32-x64-msvc
            os: windows-2022
            recipe: host
            suffix: win32-x64-msvc
          - label: linux-arm-gnueabihf-qemu
            os: ubuntu-24.04
            recipe: container
            suffix: linux-arm-gnueabihf
            platform: linux/arm/v7
            image: node:22-bookworm-slim
    runs-on: ${{ matrix.os }}
    env:
      CADMPEG_TS_NATIVE_SUFFIX: ${{ matrix.suffix }}
      CADMPEG_TS_REGISTRY_VERSION: ${{ needs.preflight.outputs.version }}
      NAPI_RS_ENFORCE_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: matrix.recipe == 'host'
        with:
          node-version: '26'
      - name: Install the published package the way a consumer does
        if: matrix.recipe == 'host'
        run: node scripts/test-package.mjs
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: matrix.recipe == 'container'
      - name: Install the published package the way a consumer does in a container
        if: matrix.recipe == 'container'
        env:
          IMAGE: ${{ matrix.image }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          docker run --rm --platform "$PLATFORM" \
            --volume "$PWD:/cadmpeg-ts" --workdir /cadmpeg-ts \
            --env CADMPEG_TS_NATIVE_SUFFIX \
            --env CADMPEG_TS_REGISTRY_VERSION \
            --env NAPI_RS_ENFORCE_VERSION_CHECK \
            "$IMAGE" sh -c 'node scripts/test-package.mjs'

  registry-release:
    if: always() && needs.registry-smoke.result == 'success'
    needs: [preflight, registry-smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record the verified release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          tag="v$VERSION"
          gh release view "$tag" >/dev/null 2>&1 \
            || gh release create "$tag" --target '${{ github.sha }}' --generate-notes

  ci-gate:
    if: always()
    needs:
      [
        preflight,
        quality,
        docs-prose,
        node,
        rust,
        build,
        build-wasm,
        assemble,
        smoke,
        browser,
        security,
        publish,
        registry-verify,
        registry-smoke,
        registry-release,
      ]
    runs-on: ubuntu-24.04
    steps:
      - name: Assert required job results
        env:
          RESULTS: ${{ toJSON(needs) }}
          PUBLISH: ${{ needs.preflight.outputs.npm-publish }}
        run: |
          node <<'NODE'
          const needs = JSON.parse(process.env.RESULTS);
          const required = [
            'preflight',
            'quality',
            'docs-prose',
            'node',
            'rust',
            'build',
            'build-wasm',
            'assemble',
            'smoke',
            'browser',
            'security',
          ];
          if (needs.preflight?.result === 'success' && process.env.PUBLISH === 'true') {
            required.push('publish', 'registry-verify', 'registry-smoke', 'registry-release');
          }
          const failures = required.filter((name) => needs[name]?.result !== 'success');
          if (failures.length) throw new Error(`required jobs did not pass: ${failures.join(', ')}`);
          NODE
