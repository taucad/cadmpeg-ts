# SPDX-License-Identifier: Apache-2.0
[package]
name = "cadmpeg-napi"
description = "napi-rs shell over cadmpeg-binding; every codec in one addon."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
cadmpeg-binding = { workspace = true, features = ["all"] }
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"
serde_json.workspace = true

[build-dependencies]
napi-build = "2"

[lints]
workspace = true
